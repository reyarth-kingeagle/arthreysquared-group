<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#0b1f3a">
<title>Instructor Tools · Sign In · ARTHREYSQUARED</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 90% 10%,#e4f5f0,#f4f7fb 48%,#edf3f7);color:#15374f;display:grid;grid-template-rows:auto 1fr auto;line-height:1.6}
header{background:#0b1f3a;color:#fff;padding:18px 20px;font-size:.91rem;font-weight:850;letter-spacing:.09em}
header span{color:#e4c689}
main{display:grid;place-items:center;padding:32px 14px}
.login{width:min(430px,100%);background:#fff;border:1px solid #dbe7ee;border-radius:22px;box-shadow:0 20px 50px rgba(13,43,68,.09);padding:clamp(24px,5vw,37px)}
.kicker{color:#0d716c;font-size:.72rem;letter-spacing:.15em;font-weight:850;text-transform:uppercase}
h1{margin:6px 0 10px;line-height:1.2;font-size:clamp(1.65rem,4.5vw,2.15rem);letter-spacing:-.035em}
p{color:#62768a;margin:0 0 22px;font-size:.91rem}
label{display:block;font-weight:750;font-size:.87rem;margin:16px 0 7px}
input{display:block;width:100%;padding:12px 13px;min-height:48px;background:#fff;border:1px solid #a5bac8;border-radius:10px;color:#183c53;font:inherit;font-size:1rem}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #be8a2d;outline-offset:3px}
button{margin-top:22px;display:block;border:0;border-radius:10px;background:#116e69;color:#fff;font:inherit;font-weight:850;padding:13px 16px;min-height:49px;width:100%;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#message{margin:15px 0 0;min-height:20px;color:#a04a30;font-size:.85rem}
.back{display:inline-block;margin-top:13px;color:#315971;font-size:.83rem}
footer{text-align:center;padding:19px;color:#76899a;font-size:.76rem}
</style>
</head>
<body>
<header>ARTHREYSQUARED <span>· INSTRUCTOR</span></header>
<main>
<section class="login" aria-labelledby="login-heading">
<span class="kicker">Private access</span>
<h1 id="login-heading">Instructor Tools</h1>
<p>Comprehensive classwork workspace</p>
<form id="login" autocomplete="off">
<label for="username">Username</label>
<input id="username" name="username" type="text" spellcheck="false" autocapitalize="off" autocomplete="username" required maxlength="100">
<label for="code">Access code</label>
<input id="code" name="code" type="password" autocomplete="off" required maxlength="256">
<button id="submit" type="submit">Access Instructor Tools</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<a class="back" href="https://www.arthreysquared.com/coursework.html#instructor">← Back to Coursework</a>
</section>
</main>
<footer>© 2026 ARTHREYSQUARED Group</footer>
<script>
(function(){
"use strict";
const form=document.getElementById("login"), button=document.getElementById("submit");
const message=document.getElementById("message");
form.addEventListener("submit", async function(event){
  event.preventDefault();
  message.textContent="";
  button.disabled=true;
  const username=document.getElementById("username").value;
  const codeInput=document.getElementById("code");
  const code=codeInput.value;
  codeInput.value="";
  try{
    const response=await fetch("/api/login",{
      method:"POST",credentials:"same-origin",cache:"no-store",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:username,code:code})
    });
    const data=await response.json();
    if(!response.ok||!data.ok){
      message.textContent=data.error||"Access denied.";
      return;
    }
    window.location.replace("/");
  }catch{
    message.textContent="Unable to connect. Try again.";
  }finally{button.disabled=false;}
});
}());
</script>
</body>
</html>
