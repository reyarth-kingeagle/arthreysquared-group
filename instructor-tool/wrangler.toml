# Independent server-side protected Instructor Tools application, NOT GitHub Pages.
# Username, access code and session key are configured as Cloudflare Worker secrets.
# Do not place credentials or private assessment data in this public file.
name = "arthreysquared-instructor"
main = "worker.js"
compatibility_date = "2026-11-17"
workers_dev = true

# No application request/body logging and no storage bindings.
[observability]
enabled = false

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Cloudflare Workers native rate-limit bindings (approximate per Cloudflare location).
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "9160171"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "GRADE_RATE_LIMITER"
namespace_id = "9160172"
[ratelimits.simple]
limit = 12
period = 60
