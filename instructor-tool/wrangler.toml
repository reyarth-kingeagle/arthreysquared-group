# Optional server-side deployment for no-login Instructor Tools.
# GitHub Pages hosts static HTML but cannot run a grading API itself.
# Keep OPENAI_API_KEY and RUBRICS_JSON in Worker secrets (never in GitHub).
name = "arthreysquared-instructor"
main = "worker.js"
compatibility_date = "2026-11-17"
workers_dev = true

[observability]
enabled = false

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Throttle unauthenticated submissions by network source.
[[ratelimits]]
name = "GRADE_RATE_LIMITER"
namespace_id = "9160172"
[ratelimits.simple]
limit = 3
period = 60
